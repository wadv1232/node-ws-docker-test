<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>轨道对接专家：引力与质量动态</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0d10; color: #fff; font-family: 'Courier New', Courier, monospace; user-select: none; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 5; }
        .hud-item { margin-bottom: 5px; text-shadow: 1px 1px 3px #000; background: rgba(0, 0, 0, 0.4); padding: 5px 8px; border-radius: 5px; }
        #message-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.85); z-index: 10;
        }
        h1 { font-size: 48px; color: #4facfe; margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 5px; }
        p { font-size: 20px; color: #ccc; text-align: center;}
        .btn {
            margin-top: 30px; padding: 15px 40px; font-size: 22px;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            border: none; color: white; cursor: pointer; border-radius: 30px;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.5); transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .hidden { display: none !important; }
        
        /* 仪表盘颜色 */
        .good { color: #00ff00; }
        .warn { color: #ffff00; }
        .bad { color: #ff3333; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="hud-item">燃料: <span id="fuel-display">100%</span></div>
    <div class="hud-item">垂直速度: <span id="speed-y-display" class="good">0.00</span> m/s</div>
    <div class="hud-item">径向速度: <span id="radial-speed-display" class="good">0.00</span> m/s</div>
    <div class="hud-item">切向速度: <span id="tangential-speed-display" class="good">0.00</span> m/s</div>
    <div class="hud-item">角度偏差: <span id="angle-display" class="good">0.00</span>°</div>
</div>

<div id="message-screen">
    <h1 id="title-text">轨道对接专家</h1>
    <p>操作指南：[W] 推进 (注意质量动态!) | [A/D] 旋转</p>
    <p style="font-size: 16px; margin-top:10px; color:#aaa;">对接要求：径向速度(靠近) < 2.0，切向速度 < 0.5，角度偏差 < 15°</p>
    <button class="btn" id="start-btn">启动引擎</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/** * 游戏核心配置与科学常数 
 */
const CONFIG = {
    GRAVITY: 0.03,               // 重力加速度
    THRUST_POWER: 15,            // 基础推力 (牛顿)
    ROTATION_SPEED: 0.06,        // 旋转速度 (弧度)
    FUEL_CONSUMPTION: 0.15,      // 燃料消耗率 (每帧)
    
    BASE_MASS: 100,              // 火箭结构质量 (kg)
    FUEL_MASS_INITIAL: 80,       // 初始燃料质量 (kg)

    DOCK_TOLERANCE_DIST: 30,     // 对接距离判定
    DOCK_MAX_RADIAL_SPEED: 2.0,  // 对接最大径向速度
    DOCK_MAX_TANGENTIAL_SPEED: 0.5, // 对接最大切向速度 (新增的科学要求)
    DOCK_MAX_ANGLE: 0.25,        // 对接最大角度偏差 (弧度, 约15度)
    FRICTION: 0.998              // 空间微阻力
};

// 游戏状态
let gameState = 'START'; // START, PLAYING, SUCCESS, FAIL
let canvas, ctx;
let keys = { w: false, a: false, d: false };

// 全局抖动变量 (趣味性增强)
let shakeIntensity = 0;
let shakeDuration = 0;

// 实体对象
let rocket, station, stars = [], particles = [];

/** * 屏幕抖动函数 (趣味性)
 */
function screenShake(intensity, duration) {
    shakeIntensity = intensity;
    shakeDuration = duration;
}

class Rocket {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = canvas.width / 2;
        this.y = canvas.height - 100;
        this.vx = 0;
        this.vy = 0;
        this.angle = -Math.PI / 2; // 朝上
        this.fuel = 100; // 百分比
        this.baseMass = CONFIG.BASE_MASS;
        this.fuelMassInitial = CONFIG.FUEL_MASS_INITIAL;
        this.active = true;
    }

    update() {
        if (!this.active || gameState !== 'PLAYING') return;

        // 1. 科学性：计算当前总质量 (质量动态)
        const currentMass = this.baseMass + (this.fuel / 100) * this.fuelMassInitial;

        // 2. 物理计算
        // 重力影响 (加速度 A = F / M，这里我们简化重力，但保持推力受质量影响)
        this.vy += CONFIG.GRAVITY;

        // 旋转
        if (keys.a) this.angle -= CONFIG.ROTATION_SPEED;
        if (keys.d) this.angle += CONFIG.ROTATION_SPEED;

        // 推力
        if (keys.w && this.fuel > 0) {
            // F / M = A: 推力效果除以当前总质量
            const effectiveAcceleration = CONFIG.THRUST_POWER / currentMass; 

            this.vx += Math.cos(this.angle) * effectiveAcceleration;
            this.vy += Math.sin(this.angle) * effectiveAcceleration;
            
            // 燃料消耗
            this.fuel = Math.max(0, this.fuel - CONFIG.FUEL_CONSUMPTION);
            
            // 趣味性：屏幕抖动和粒子
            screenShake(1.5, 3);
            createParticles(this.x, this.y, this.angle + Math.PI, 5);
        }

        // 阻力/摩擦
        this.vx *= CONFIG.FRICTION;
        this.vy *= CONFIG.FRICTION;

        // 位置更新
        this.x += this.vx;
        this.y += this.vy;

        // 边界碰撞 (地面)
        if (this.y > canvas.height - 10) {
            if (Math.abs(this.vy) > 3) {
                endGame(false, "撞击地面！速度过快导致解体。");
            } else {
                this.y = canvas.height - 10;
                this.vy = 0;
                this.vx = 0;
            }
        }
        
        // 边界限制 (左右顶)
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < -50) this.y = -50; // 防止飞出太远

        // 对接检测 (科学性增强)
        this.checkDocking();
    }

    checkDocking() {
        // 计算与接口的相对位置
        const dx = station.dockX - this.x;
        const dy = station.dockY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // 1. 科学性：计算径向和切向速度
        const totalSpeed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        
        let radialVelocity = 0;
        let tangentialVelocity = totalSpeed;

        if (dist > 0.01) { // 避免除以零
            const ux = dx / dist; // 径向单位向量 X
            const uy = dy / dist; // 径向单位向量 Y

            // 径向速度 (速度点积径向单位向量): 负值表示靠近目标
            radialVelocity = (this.vx * ux + this.vy * uy); 
            
            // 切向速度 (总速度减去径向速度在切向上的分量)
            tangentialVelocity = Math.sqrt(totalSpeed*totalSpeed - radialVelocity*radialVelocity);
        }
        
        // 角度差 (目标角度是 -PI/2)
        let angleDiff = Math.abs(normalizeAngle(this.angle) - (-Math.PI/2));
        if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

        // 更新HUD数据
        updateHUD(this.vy, radialVelocity, tangentialVelocity, angleDiff, this.fuel);

        // 判定碰撞/对接
        if (dist < CONFIG.DOCK_TOLERANCE_DIST) {
            let success = true;
            let reason = [];
            
            // 对接要求判定
            if (Math.abs(radialVelocity) > CONFIG.DOCK_MAX_RADIAL_SPEED) {
                 success = false; reason.push(`径向速度过大 (${radialVelocity.toFixed(1)} > ${CONFIG.DOCK_MAX_RADIAL_SPEED})`);
            }
            if (tangentialVelocity > CONFIG.DOCK_MAX_TANGENTIAL_SPEED) {
                success = false; reason.push(`切向速度过高 (${tangentialVelocity.toFixed(1)} > ${CONFIG.DOCK_MAX_TANGENTIAL_SPEED})`);
            }
            if (angleDiff > CONFIG.DOCK_MAX_ANGLE) {
                success = false; reason.push(`角度偏差过大 (${(angleDiff*180/Math.PI).toFixed(0)}° > ${CONFIG.DOCK_MAX_ANGLE*180/Math.PI}°)`);
            }

            if (success) {
                endGame(true, "对接成功！你是轨道力学专家。");
            } else {
                endGame(false, "对接失败：撞击速度过大或姿态不正。" + reason.join(" | "));
            }
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // 火箭主体 (白色)
        ctx.fillStyle = this.fuel > 0 ? '#fff' : '#888';
        ctx.beginPath();
        ctx.moveTo(15, 0);      // 头部尖端
        ctx.lineTo(-10, 10);    // 右翼尖
        ctx.lineTo(-5, 0);      // 尾部中心
        ctx.lineTo(-10, -10);   // 左翼尖
        ctx.closePath();
        ctx.fill();

        // 驾驶舱窗户 (蓝色)
        ctx.fillStyle = '#4facfe';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Station {
    constructor() {
        this.x = canvas.width / 2;
        this.y = 150;
        this.dockX = this.x;
        this.dockY = this.y + 35; // 接口在中心下方
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 太阳能板
        ctx.fillStyle = '#333';
        ctx.strokeStyle = '#4facfe';
        ctx.lineWidth = 2;
        ctx.fillRect(-60, -10, 120, 20);
        ctx.strokeRect(-60, -10, 120, 20);

        // 核心舱
        ctx.fillStyle = '#ddd';
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fill();

        // 对接接口 (绿色表示目标)
        ctx.fillStyle = '#0f0';
        ctx.fillRect(-5, 25, 10, 10);
        
        // 趣味性增强：对接目标框 (Targeting Box)
        ctx.strokeStyle = 'rgba(79, 172, 254, 0.6)'; // 蓝色
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(-30, 30, 60, 60); 

        // 引导线
        ctx.strokeStyle = 'rgba(0, 255, 0, 0.2)';
        ctx.beginPath();
        ctx.moveTo(0, 35);
        ctx.lineTo(0, 200);
        ctx.stroke();
        ctx.setLineDash([]); // 重置虚线

        ctx.restore();
    }
}

class Particle { /* ... (Particle class remains the same) ... */
    constructor(x, y, angle, speed) {
        this.x = x;
        this.y = y;
        const spread = 0.5;
        const finalAngle = angle + (Math.random() - 0.5) * spread;
        this.vx = Math.cos(finalAngle) * speed;
        this.vy = Math.sin(finalAngle) * speed;
        this.life = 1.0;
        this.decay = 0.03 + Math.random() * 0.03;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }

    draw() {
        ctx.fillStyle = `rgba(255, ${Math.floor(this.life * 255)}, 0, ${this.life})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2 + this.life * 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 辅助函数：角度归一化到 -PI ~ PI
function normalizeAngle(a) {
    a = a % (2 * Math.PI);
    if (a > Math.PI) a -= 2 * Math.PI;
    if (a < -Math.PI) a += 2 * Math.PI;
    return a;
}

function createParticles(x, y, angle, count) {
    for(let i=0; i<count; i++) {
        // 粒子从火箭尾部生成，稍微向后偏移
        const pX = x - Math.cos(angle) * 15;
        const pY = y - Math.sin(angle) * 15;
        particles.push(new Particle(pX, pY, angle, Math.random() * 2 + 1));
    }
}

function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    
    // 输入监听
    window.addEventListener('keydown', e => setKey(e.key, true));
    window.addEventListener('keyup', e => setKey(e.key, false));
    
    const btn = document.getElementById('start-btn');
    btn.addEventListener('click', startGame);

    // 生成背景星空
    for(let i=0; i<100; i++) {
        stars.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, size: Math.random() * 2, alpha: Math.random() });
    }

    rocket = new Rocket();
    station = new Station();

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (station) station.x = canvas.width / 2;
    if (rocket && gameState === 'START') rocket.x = canvas.width / 2;
}

function setKey(k, s) {
    if (k === 'w' || k === 'ArrowUp') keys.w = s;
    if (k === 'a' || k === 'ArrowLeft') keys.a = s;
    if (k === 'd' || k === 'ArrowRight') keys.d = s;
}

function startGame() {
    document.getElementById('message-screen').classList.add('hidden');
    rocket.reset();
    particles = [];
    gameState = 'PLAYING';
}

function endGame(success, msg) {
    gameState = success ? 'SUCCESS' : 'FAIL';
    const screen = document.getElementById('message-screen');
    const title = document.getElementById('title-text');
    const btn = document.getElementById('start-btn');
    const p = screen.querySelector('p:nth-of-type(1)'); 

    screen.classList.remove('hidden');
    title.innerText = success ? "任务完成" : "任务失败";
    title.style.color = success ? "#00ff00" : "#ff3333";
    p.innerText = msg;
    btn.innerText = "重新尝试";
}

function updateHUD(speedY, radialSpeed, tangentialSpeed, angleDiff, fuel) {
    const syEl = document.getElementById('speed-y-display');
    const rsEl = document.getElementById('radial-speed-display');
    const tsEl = document.getElementById('tangential-speed-display');
    const aEl = document.getElementById('angle-display');
    const fEl = document.getElementById('fuel-display');

    // 格式化数据
    let angleDeg = (angleDiff * 180 / Math.PI).toFixed(1);
    
    // 垂直速度 (仅显示，不参与严格判定)
    syEl.innerText = speedY.toFixed(2); 

    // 径向速度 (必须接近0，但可以略微靠近目标)
    rsEl.innerText = radialSpeed.toFixed(2);
    rsEl.className = Math.abs(radialSpeed) > CONFIG.DOCK_MAX_RADIAL_SPEED ? 'bad' : 'good';
    
    // 切向速度 (必须接近0，这是对接的关键)
    tsEl.innerText = tangentialSpeed.toFixed(2);
    tsEl.className = tangentialSpeed > CONFIG.DOCK_MAX_TANGENTIAL_SPEED ? 'bad' : 'good';

    // 角度
    aEl.innerText = angleDeg;
    aEl.className = angleDiff > CONFIG.DOCK_MAX_ANGLE ? 'bad' : 'good';
    
    // 燃料
    fEl.innerText = Math.floor(fuel) + '%';
    fEl.className = fuel < 20 ? 'bad' : (fuel < 50 ? 'warn' : 'good');
}

function loop() {
    requestAnimationFrame(loop);

    // 趣味性：应用屏幕抖动
    ctx.save();
    let offsetX = 0, offsetY = 0;
    if (shakeDuration > 0) {
        offsetX = Math.random() * shakeIntensity * 2 - shakeIntensity;
        offsetY = Math.random() * shakeIntensity * 2 - shakeIntensity;
        shakeDuration--;
    }
    ctx.translate(offsetX, offsetY);

    // 清屏
    ctx.fillStyle = '#0b0d10';
    ctx.fillRect(0 - offsetX, 0 - offsetY, canvas.width, canvas.height); // 需要抵消translate，或者直接清空，然后save/restore

    // 绘制星空
    ctx.fillStyle = '#fff';
    stars.forEach(star => {
        ctx.globalAlpha = star.alpha;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // 游戏逻辑更新
    if (gameState === 'PLAYING') {
        rocket.update();
        
        // 粒子更新
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
    }

    // 绘制实体
    station.draw();
    rocket.draw();

    ctx.restore(); // 结束抖动影响
}

init();

</script>
</body>
</html>
